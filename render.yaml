services:
  - type: web
    name: aroko-backend
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BASE_URL
        value: https://aroko-backend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://tu-flutter-app.web.app
      - key: DATABASE_URL
        fromDatabase:
          name: aroko-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

databases:
  - name: aroko-db
    region: oregon
    plan: starter
